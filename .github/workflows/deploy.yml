name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - clean-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _build/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: _build
      - name: Install Quartz Plugins
        run: npx quartz plugin install
        working-directory: _build
      - name: Build Quartz
        run: npx quartz build --directory ".."
        working-directory: _build
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy public --project-name=rootstack
        working-directory: _build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set Custom Domain
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$(curl -s https://api.cloudflare.com/client/v4/accounts -H 'Authorization: Bearer $CLOUDFLARE_API_TOKEN' | jq -r '.result[0].id')/pages/projects/rootstack/domains" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -d '{"name":"rootstack.misser.top"}' || echo "domain may already exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
